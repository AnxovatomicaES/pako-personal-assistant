<style>
  :root { --grad: linear-gradient(100deg, #8b7bff 0%, #29c4ff 45%, #4ff2b0 100%); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: var(--h, 1350px); overflow: hidden; background: #06070d; color: #f2f4ff; font-family: "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .orb { width: 44px; height: 44px; border-radius: 50%; position: relative; background: radial-gradient(circle at 38% 32%, #8fe6ff, #29c4ff 32%, #5b46ff 70%, #241a7a); box-shadow: 0 0 24px rgba(91,70,255,.7); }

  .orb i:first-child { left: 30%; } .orb i:last-child { right: 30%; }
  .card { background: rgba(14,16,30,.78); border: 1.5px solid rgba(255,255,255,.12); border-radius: 34px; padding: 34px 38px; backdrop-filter: blur(20px); box-shadow: 0 40px 100px -30px rgba(0,0,0,.9); }
  .msg { font-size: 32px; line-height: 1.4; }

  .chips span { padding: 12px 24px; border-radius: 999px; font-size: 26px; font-weight: 650; border: 1.5px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); }
  .chips .go { background: #fff; color: #06070d; }
  .stop { width: 400px; height: 400px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 72px; letter-spacing: .08em;
    background: radial-gradient(circle at 40% 30%, #ff8aa0, #ff3d63 45%, #a0122f); box-shadow: 0 0 0 26px rgba(255,93,122,.12), 0 0 0 54px rgba(255,93,122,.06), 0 60px 140px -20px rgba(255,61,99,.7), inset 0 -24px 50px rgba(0,0,0,.35); }
  .dots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
  .dots i { aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.08); }
  .dots i.lit { background: #4ff2b0; box-shadow: 0 0 30px 8px rgba(79,242,176,.7); }
  .brief { border-radius: 28px; overflow: hidden; height: 740px; border: 1.5px solid rgba(255,255,255,.5); box-shadow: 0 50px 120px -30px rgba(0,0,0,.85); background: #f6f1e8; position: relative; }
  .brief .bar { height: 56px; background: #ebe7e1; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid #ddd7ce; }
  .brief .bar i { width: 14px; height: 14px; border-radius: 50%; background: #ff5f57; } .brief .bar i:nth-child(2) { background: #febc2e; } .brief .bar i:nth-child(3) { background: #28c840; }
  .brief .bar b { margin-left: 12px; font-size: 20px; color: #2a2622; background: #fbfaf8; padding: 6px 16px; border-radius: 10px; }
  .brief iframe { border: 0; width: 980px; height: 1400px; transform: scale(.928); transform-origin: 0 0; }
  .graph text { font-size: 26px; fill: #a9b0cf; font-family: "Inter Tight"; text-anchor: middle; }

<script type="module">
import { createScene } from "../scene.js";
const n = new URLSearchParams(location.search).get("n") || "1";
const foot = `<div class="foot"><span class="brand"><span class="orb"><i></i><i></i></span>Pako</span><span>pako-os.com</span></div>`;
// Each post: the figure's place [x, y, size], its mood, and what is written over it.
const POSTS = {
  avatar: { layout: [0, 0, 1.45], mood: "idle", h: 1080, html: "" },
  1: { layout: [0.7, -1.5, 1.0], mood: "listening", html: `<p class="kicker">Personal AI assistant</p><h1>Your chief<br>of staff.<br><span class="serif">On your own computer.</span></h1>${foot}` },
  2: { layout: [0, 1.55, 0.95], mood: "listening", html: `<div style="margin-top:auto"><h1 style="font-size:150px;text-align:center">Meet <span class="grad">Pako.</span></h1><p class="sub" style="text-align:center;margin:20px auto 40px">It remembers, follows up, briefs you every morning, and lets you keep the last word.</p></div>${foot}` },
  3: { layout: [3.6, 3.3, .45], mood: "speaking", html: `<p class="kicker">08:00 · the morning brief</p><h1 style="font-size:76px;margin:20px 0 40px">Your day, <span class="serif">written for you.</span></h1><div class="brief"><div class="bar"><i></i><i></i><i></i><b>The Morning Brief</b></div><iframe src="../brief/"></iframe></div>${foot}` },
  4: { layout: [2.45, 2.7, .4], mood: "thinking", html: `<p class="kicker" style="margin-top:260px">Follow-ups</p><h1 style="font-size:84px">It checks. <span class="serif">Then it reminds.</span></h1><div class="card" style="margin-top:56px"><div class="msg">📌 <b>Samir</b> asked you on Slack to set up the 5:15 PM ET call (22:15 London). I see no meeting yet on Zoom or your calendar.</div><div class="chips"><span>Done</span><span>In 1 h</span><span>Not mine</span></div></div>${foot}` },
  5: { layout: [1.85, -1.85, .5], mood: "speaking", html: `<p class="kicker">Tables</p><h1 style="font-size:84px">“A table for four, <span class="serif">Friday at nine.”</span></h1><div class="card" style="margin-top:70px"><div class="msg">🍣 Three real places, ranked. You pick one.<br>One card. Your yes. Pako writes to them.</div><div class="chips"><span class="go">Ask them</span><span>Cancel</span></div></div>${foot}` },
  6: { layout: [2.45, -0.35, .4], mood: "paused", html: `<p class="kicker">You keep the last word</p><h1 style="font-size:84px">One word <span class="serif">stops everything.</span></h1><div style="display:grid;place-items:center;flex:1"><div class="stop">STOP</div></div><p class="sub" style="text-align:center;margin:0 auto 40px">Every change comes with Undo. Other people's words never give orders.</p>${foot}` },
  7: { layout: [0, 2.55, .5], mood: "idle", html: `<div style="margin-top:auto"><p class="kicker">Memory</p><h1 style="font-size:84px">It remembers <span class="serif">the people in your life.</span></h1><svg class="graph" viewBox="0 0 900 420" style="margin:40px 0"><g stroke="rgba(41,196,255,.5)" stroke-width="2.5" stroke-dasharray="8 10" fill="none"><path d="M450 210 L170 90"/><path d="M450 210 L740 100"/><path d="M450 210 L220 340"/><path d="M450 210 L690 330"/></g><g stroke="#29c4ff" stroke-width="3" fill="#1b1d38"><circle cx="170" cy="90" r="22"/><circle cx="740" cy="100" r="22"/><circle cx="220" cy="340" r="22"/><circle cx="690" cy="330" r="22"/></g><circle cx="450" cy="210" r="40" fill="#5b46ff"/><text x="450" y="219" style="fill:#fff;font-weight:700">you</text><text x="170" y="45">Ana · sister</text><text x="740" y="55">Rohan · moved to Thu</text><text x="220" y="400">Samir · Slack</text><text x="690" y="392">Mum · 14 March</text></svg></div>${foot}` },
  8: { layout: [0, 2.15, .75], mood: "idle", html: `<div style="margin-top:auto"><p class="kicker">Privacy</p><h1 style="font-size:84px">Your computer.<br>Your Claude.<br><span class="serif">Your assistant.</span></h1><p class="sub">The Pako project receives none of your data. No Pako account, no Pako server.</p></div>${foot}` },
  s1: { layout: [0, 1.6, 1.05], mood: "listening", h: 1920, html: `<div style="margin-top:auto;text-align:center"><p class="kicker">New</p><h1 style="font-size:130px">Pako is <span class="grad">here.</span></h1><p class="sub" style="margin:28px auto 60px">Your chief of staff, on your own computer.<br>Free · open source</p><p class="sub" style="color:#f2f4ff;font-weight:700;margin:0 auto 120px">pako-os.com</p></div>${foot}` },
  s2: { layout: [0, -1.7, .95], mood: "speaking", h: 1920, html: `<p class="kicker" style="margin-top:300px">A day with Pako</p><h1 style="font-size:96px">08:00 <span class="serif">your brief.</span><br>11:20 <span class="serif">a follow-up.</span><br>21:00 <span class="serif">your table.</span></h1><p class="sub">It does the chores you don't want to do. You keep the last word.</p>${foot}` },
  s3: { layout: [0, -1.1, .8], mood: "listening", h: 1920, html: `<p class="kicker" style="margin-top:120px">Ask me anything</p><h1 style="font-size:104px">What would you <span class="serif">hand to Pako first?</span></h1><p class="sub">Reply to this story 👇</p>${foot}` },
  c1: { layout: [0, -1.5, 1.0], mood: "speaking", html: `<p class="kicker">Behind the scenes</p><h1>How Pako writes <span class="serif">your 08:00 brief.</span></h1><p class="sub">Swipe → four steps, every morning.</p>${foot}` },
  c2: { layout: [2.9, 2.9, .4], mood: "thinking", html: `<p class="kicker">Step 1</p><h1 style="font-size:88px">It reads <span class="serif">what you connected.</span></h1><div class="card" style="margin-top:60px"><div class="msg">Your calendars, your mail, Slack, Zoom summaries, your tasks and the people in your life. Nothing else.</div><div class="chips" style="margin-top:34px"><span>📅 Calendar</span><span>✉️ Mail</span><span># Slack</span><span>🎥 Zoom</span><span>✓ Tasks</span><span>👥 People</span></div></div>${foot}` },
  c3: { layout: [2.9, -2.4, .45], mood: "thinking", html: `<p class="kicker">Step 2</p><h1 style="font-size:88px">It finds <span class="serif">the one thing that moves your week.</span></h1><div class="card" style="margin-top:60px"><div class="msg"><b>Finish the Q4 deck before the 15:00 review.</b><br>Three slides are still empty, and Rohan wants the numbers by noon.</div><div class="chips"><span class="go">Let's do it</span></div></div>${foot}` },
  c4: { layout: [-2.9, -2.4, .45], mood: "speaking", html: `<p class="kicker">Step 3</p><h1 style="font-size:88px">It checks <span class="serif">before it reminds.</span></h1><div class="card" style="margin-top:60px"><div class="msg"><b>Set up the 5:15 PM ET call with Samir.</b><br>🔎 Checked: no meeting on Zoom or your calendar yet.</div></div>${foot}` },
  c5: { layout: [0, -1.9, .75], mood: "listening", html: `<p class="kicker">Step 4</p><h1 style="font-size:88px">Every line says <span class="serif">where it came from.</span></h1><div class="chips" style="margin-top:34px"><span>Slack · Samir</span><span>Zoom · Weekly sync</span><span>Mail · Rohan</span><span>Calendar</span></div><p class="sub" style="margin-top:40px">No guessing. If Pako couldn't read a source, the brief says so.<br><b style="color:#f2f4ff">pako-os.com</b></p>${foot}` },
  r1: { layout: [0, 0.9, 1.1], mood: "listening", h: 1920, html: `<style>
    .seq { position:absolute; left:86px; right:86px; bottom:330px; text-align:center; }
    .seq h1 { position:absolute; left:0; right:0; bottom:0; opacity:0; transform:translateY(40px); }
    body.go .seq h1 { animation: inout 3.4s cubic-bezier(.2,.8,.2,1) both; }
    body.go .seq h1:nth-child(1) { animation-delay: .3s } body.go .seq h1:nth-child(2) { animation-delay: 3.4s } body.go .seq h1:nth-child(3) { animation-delay: 6.5s; animation-name: inonly }
    @keyframes inout { 0% { opacity:0; transform:translateY(40px) } 15%,82% { opacity:1; transform:none } 100% { opacity:0; transform:translateY(-30px) } }
    @keyframes inonly { 0% { opacity:0; transform:translateY(40px) } 20%,100% { opacity:1; transform:none } }
  </style><div class="seq"><h1 style="font-size:120px">Your chief<br>of staff.</h1><h1 style="font-size:120px"><span class="serif">On your own computer.</span></h1><h1 style="font-size:110px">Meet <span class="grad">Pako.</span><br><span style="font-size:48px;color:#a9b0cf;font-weight:600">pako-os.com</span></h1></div>${foot}` },
  p1: { layout: [0, -1.6, 1.0], mood: "idle", html: `<p class="kicker">Privacy</p><h1>Your data <span class="serif">stays home.</span></h1><p class="sub">Swipe → what stays on your computer, what goes to Claude, what never leaves.</p>${foot}` },
  p2: { layout: [2.9, 2.9, .4], mood: "listening", html: `<p class="kicker">Stays on your computer</p><h1 style="font-size:88px">Everything <span class="serif">Pako remembers.</span></h1><div class="card" style="margin-top:60px"><div class="msg">People, notes, follow-ups, reminders and your settings live in a folder on your own computer. You can open it, export it or delete it.</div><div class="chips" style="margin-top:34px"><span>👥 People</span><span>📝 Notes</span><span>📌 Follow-ups</span><span>⏰ Reminders</span></div></div>${foot}` },
  p3: { layout: [-1.7, -1.8, .55], mood: "thinking", html: `<p class="kicker">Goes to Claude</p><h1 style="font-size:88px">Only what <span class="serif">a task needs.</span></h1><div class="card" style="margin-top:60px"><div class="msg">To write your brief or answer a message, Pako asks Claude through Claude Code on your computer, signed in to your own Claude account.</div></div>${foot}` },
  p4: { layout: [0, -1.9, .75], mood: "happy", html: `<p class="kicker">Never leaves</p><h1 style="font-size:88px">Nothing goes <span class="serif">to the Pako project.</span></h1><p class="sub">No Pako account. No Pako server. No analytics.<br>Details at <b style="color:#f2f4ff">pako-os.com/privacy</b></p>${foot}` },
  10: { layout: [0, 2.2, .7], mood: "listening", html: `<div style="margin-top:auto"><p class="kicker">Ask Pako</p><h1 style="font-size:84px">“Remind me to call Mum <span class="serif">on Sunday.”</span></h1><div class="card" style="margin-top:50px"><div class="msg">⏰ Done. Sunday 11:00, on WhatsApp. I'll ask again at 18:00 if it's still open.</div><div class="chips"><span>Earlier</span><span>Undo</span></div></div></div>${foot}` },
  11: { layout: [1.7, -1.8, .55], mood: "speaking", html: `<p class="kicker" style="margin-top:300px">Where you already are</p><h1 style="font-size:96px">WhatsApp. <span class="serif">Telegram.</span><br>No new app.</h1><p class="sub">Write to Pako like you write to a friend. It answers there, too.</p>${foot}` },
  s4: { layout: [0, -1.4, .9], mood: "thinking", h: 1920, html: `<p class="kicker" style="margin-top:140px">Quick question</p><h1 style="font-size:110px">Brief at <span class="grad">07:00</span><br>or <span class="serif">08:00?</span></h1><p class="sub">Reply with your time 👇</p>${foot}` },
  s5: { layout: [0, -1.0, .8], mood: "paused", h: 1920, html: `<p class="kicker" style="margin-top:140px">You keep the last word</p><h1 style="font-size:110px">Say <span class="grad">STOP.</span><br><span class="serif">Pako stops.</span></h1><p class="sub">Nothing goes out until you say RESUME.</p>${foot}` },
  e1: { layout: [0, -1.5, .75], mood: "thinking", h: 1920, html: `<p class="kicker" style="margin-top:140px">Be honest 👀</p><h1 style="font-size:116px">How many <span class="serif">unread emails</span> right now?</h1><div class="chips" style="margin-top:56px"><span>0 😇</span><span>1–50</span><span>50–500</span><span>500+ 🫠</span></div><p class="sub" style="margin-top:44px">Reply with your number. No judging. (Okay, a little.)</p>${foot}` },
  e2: { layout: [0, -1.6, .7], mood: "listening", h: 1920, html: `<p class="kicker" style="margin-top:140px">This or that</p><h1 style="font-size:112px">Inbox <span class="grad">zero</span><br>or inbox <span class="serif">∞?</span></h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:60px"><div class="card" style="text-align:center"><div class="msg" style="font-size:72px">🧘</div><div class="msg"><b>Zero.</b> Every night.</div></div><div class="card" style="text-align:center"><div class="msg" style="font-size:72px">🌊</div><div class="msg"><b>Infinite.</b> It's fine.</div></div></div><p class="sub" style="margin-top:44px">Reply “zero” or “∞” 👇</p>${foot}` },
  e3: { layout: [0, -2.1, .6], mood: "speaking", h: 1920, html: `<p class="kicker" style="margin-top:140px">Tiny habit · 30 seconds</p><h1 style="font-size:104px">Write down <span class="serif">every “I'll send it tomorrow.”</span></h1><div class="card" style="margin-top:56px"><div class="msg">Who you promised. What. By when.<br>Most dropped balls aren't laziness. They're promises nobody wrote down.</div></div><p class="sub" style="margin-top:44px">What's the promise you keep forgetting? 👇</p>${foot}` },
  f1: { layout: [1.9, -1.3, .55], mood: "thinking", html: `<p class="kicker">Save this · copy-paste ready</p><h1 style="font-size:108px">6 follow-up texts that <span class="serif">aren't awkward.</span></h1><p class="sub">For the reply that never came, the thing you owe, the meeting nobody booked. Swipe →</p>${foot}` },
  f2: { layout: [2.2, -1.25, .42], mood: "listening", html: `<div style="font-family:'JetBrains Mono',monospace;font-size:170px;line-height:1;color:rgba(41,196,255,.22);margin-top:30px">01</div><h1 style="font-size:78px">When they <span class="serif">went quiet</span></h1><div class="card" style="margin-top:40px"><div class="msg">“Bumping this up in case it got buried. No rush, happy to pick it up whenever suits you.”</div></div>${foot}` },
  f3: { layout: [-2.2, -1.25, .42], mood: "speaking", html: `<div style="font-family:'JetBrains Mono',monospace;font-size:170px;line-height:1;color:rgba(41,196,255,.22);margin-top:30px">02</div><h1 style="font-size:78px">When <span class="serif">you</span> dropped it</h1><div class="card" style="margin-top:40px"><div class="msg">“I dropped the ball on this, sorry. Here it is now.”<br><span style="color:#a9b0cf">Then the thing. No long apology.</span></div></div>${foot}` },
  f4: { layout: [2.2, -1.25, .42], mood: "listening", html: `<div style="font-family:'JetBrains Mono',monospace;font-size:170px;line-height:1;color:rgba(41,196,255,.22);margin-top:30px">03</div><h1 style="font-size:78px">Before a <span class="serif">plan</span> fades</h1><div class="card" style="margin-top:40px"><div class="msg">“Still good for Thursday at 7? I’ll book if so.”<br><span style="color:#a9b0cf">One question, one next step.</span></div></div>${foot}` },
  f5: { layout: [-2.2, -1.25, .42], mood: "speaking", html: `<div style="font-family:'JetBrains Mono',monospace;font-size:170px;line-height:1;color:rgba(41,196,255,.22);margin-top:30px">04</div><h1 style="font-size:78px">After <span class="serif">“let’s sync”</span></h1><div class="card" style="margin-top:40px"><div class="msg">“Closing the loop: we agreed A, B by Friday, and I’ll send C. Shout if I missed anything.”</div></div>${foot}` },
  f6: { layout: [2.2, -1.25, .42], mood: "listening", html: `<div style="font-family:'JetBrains Mono',monospace;font-size:170px;line-height:1;color:rgba(41,196,255,.22);margin-top:30px">05</div><h1 style="font-size:78px">When you <span class="serif">sent</span> something</h1><div class="card" style="margin-top:40px"><div class="msg">“Did this land OK? Happy to change anything.”<br><span style="color:#a9b0cf">Invites a yes, not a silence.</span></div></div>${foot}` },
  f7: { layout: [-2.2, -1.25, .42], mood: "speaking", html: `<div style="font-family:'JetBrains Mono',monospace;font-size:170px;line-height:1;color:rgba(41,196,255,.22);margin-top:30px">06</div><h1 style="font-size:78px">When it’s <span class="serif">been months</span></h1><div class="card" style="margin-top:40px"><div class="msg">“Saw this and thought of you. How did the move go?”<br><span style="color:#a9b0cf">A reason, then a real question.</span></div></div>${foot}` },
  f8: { layout: [0, -1.9, .8], mood: "happy", html: `<p class="kicker">The hard part is the timing</p><h1 style="font-size:92px">Pako tells you <span class="grad">when</span> <span class="serif">to send them.</span></h1><p class="sub">It notices what you promised and who went quiet, in your chats, Slack and mail, and nudges you at the right moment.<br><b style="color:#f2f4ff">pako-os.com</b></p>${foot}` },
