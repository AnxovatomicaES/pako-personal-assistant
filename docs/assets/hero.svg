<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pako, your personal AI assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="1" stop-color="#0f1120"/>
    </linearGradient>
    <radialGradient id="a1" cx="0.2" cy="0.1" r="0.6"><stop offset="0" stop-color="#5b46ff" stop-opacity=".55"/><stop offset="1" stop-color="#5b46ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="a2" cx="0.85" cy="0.3" r="0.55"><stop offset="0" stop-color="#00b3ff" stop-opacity=".45"/><stop offset="1" stop-color="#00b3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="a3" cx="0.55" cy="1" r="0.6"><stop offset="0" stop-color="#00e09a" stop-opacity=".35"/><stop offset="1" stop-color="#00e09a" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#b9adff"/>
      <stop offset="0.45" stop-color="#5b46ff"/>
      <stop offset="0.78" stop-color="#29c4ff"/>
      <stop offset="1" stop-color="#4ff2b0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" x2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="0.55" stop-color="#39d0ff"/>
      <stop offset="1" stop-color="#4ff2b0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <style>
      .float { animation: float 6s ease-in-out infinite; transform-origin: 300px 200px; transform-box: view-box; }
      .halo { animation: breathe 5s ease-in-out infinite; transform-origin: 300px 200px; transform-box: view-box; }
      .ring1 { animation: spin 24s linear infinite; transform-origin: 300px 200px; transform-box: view-box; }
      .ring2 { animation: spin 36s linear infinite reverse; transform-origin: 300px 200px; transform-box: view-box; }
      .blob1 { animation: drift 14s ease-in-out infinite alternate; }
      .blob2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
      .tw { animation: twinkle 3s ease-in-out infinite; }
      .tw:nth-child(2n) { animation-delay: -1.2s; }
      .tw:nth-child(3n) { animation-delay: -2.1s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.08); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px,-20px); } }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#a1)" class="blob1"/>
  <rect width="1200" height="400" rx="28" fill="url(#a2)" class="blob2"/>
  <rect width="1200" height="400" rx="28" fill="url(#a3)"/>
  <g fill="#fff">
    <circle class="tw" cx="120" cy="70" r="1.4"/><circle class="tw" cx="210" cy="330" r="1.2"/><circle class="tw" cx="470" cy="60" r="1.5"/>
    <circle class="tw" cx="520" cy="340" r="1.1"/><circle class="tw" cx="1100" cy="80" r="1.3"/><circle class="tw" cx="1040" cy="330" r="1.6"/>
    <circle class="tw" cx="760" cy="40" r="1.1"/><circle class="tw" cx="880" cy="360" r="1.2"/><circle class="tw" cx="60" cy="220" r="1.3"/>
  </g>
  <g class="float">
    <circle class="halo" cx="300" cy="200" r="120" fill="#5b46ff" opacity=".6" filter="url(#glow)"/>
    <g class="ring1" fill="none" stroke="#8b7bff" stroke-opacity=".55" stroke-width="1.2">
      <ellipse cx="300" cy="200" rx="150" ry="44" transform="rotate(-18 300 200)" stroke-dasharray="2 10"/>
    </g>
    <g class="ring2" fill="none" stroke="#39d0ff" stroke-opacity=".45" stroke-width="1">
      <ellipse cx="300" cy="200" rx="135" ry="60" transform="rotate(24 300 200)" stroke-dasharray="1 7"/>
    </g>
    <circle cx="300" cy="200" r="92" fill="url(#orb)"/>
    <ellipse cx="268" cy="166" rx="34" ry="20" fill="#fff" opacity=".35" filter="url(#soft)"/>
  </g>
  <text x="470" y="182" font-size="96" font-weight="800" letter-spacing="-4" fill="url(#text)">Pako</text>
  <text x="474" y="232" font-size="26" font-weight="600" fill="#eef0f8">Your personal AI assistant. On your own computer.</text>
  <text x="474" y="272" font-size="19" fill="#a7adc2">Chat · Reminders · Memory · Email · Calendar · Slack · Tables · Phone · A live control panel</text>
  <g font-size="14" font-weight="700">
    <rect x="474" y="300" width="128" height="32" rx="16" fill="#4ff2b0" fill-opacity=".14" stroke="#4ff2b0" stroke-opacity=".5"/>
    <text x="538" y="321" text-anchor="middle" fill="#4ff2b0">● Runs locally</text>
    <rect x="614" y="300" width="142" height="32" rx="16" fill="#8b7bff" fill-opacity=".14" stroke="#8b7bff" stroke-opacity=".5"/>
    <text x="685" y="321" text-anchor="middle" fill="#b9adff">Claude inside</text>
    <rect x="768" y="300" width="170" height="32" rx="16" fill="#39d0ff" fill-opacity=".12" stroke="#39d0ff" stroke-opacity=".5"/>
    <text x="853" y="321" text-anchor="middle" fill="#7fe1ff">0 keys to start</text>
  </g>
</svg>
