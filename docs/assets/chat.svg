<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-label="The chat window: Pako sets a reminder and offers three restaurants">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11131f"/><stop offset="1" stop-color="#0b0d16"/></linearGradient>
    <linearGradient id="you" x1="0" x2="1"><stop offset="0" stop-color="#6a56ff"/><stop offset="1" stop-color="#2e9de0"/></linearGradient>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset=".55" stop-color="#39d0ff"/><stop offset="1" stop-color="#4ff2b0"/></linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#b9adff"/><stop offset=".55" stop-color="#5b46ff"/><stop offset="1" stop-color="#29c4ff"/></radialGradient>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #eef0f8; font-size: 14.5px; }
      .small { font-size: 11px; fill: #6d7389; }
      .pako { fill: #1c2033; stroke: #ffffff; stroke-opacity: .08; }
      .btn { fill: #141724; stroke: #ffffff; stroke-opacity: .2; }
      .in { animation: rise .6s cubic-bezier(.2,1,.3,1) both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .5s } .d3 { animation-delay: .9s } .d4 { animation-delay: 1.3s } .d5 { animation-delay: 1.7s }
      .orb { animation: bob 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
      @keyframes bob { 50% { transform: scale(1.07); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="520" height="600" rx="26" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".1"/>
  <circle class="orb" cx="42" cy="42" r="17" fill="url(#orb)"/>
  <text x="70" y="40" style="font-weight:700">Pako</text><text x="70" y="57" class="small">online</text>
  <line x1="0" y1="78" x2="520" y2="78" stroke="#fff" stroke-opacity=".07"/>

  <g class="in d1"><rect class="pako" x="20" y="96" width="330" height="62" rx="18"/>
    <text x="36" y="122">Hi, Ana. I'm Pako, your assistant.</text><text x="36" y="142">Ask me anything.</text></g>
  <g class="in d2"><rect x="196" y="176" width="304" height="40" rx="18" fill="url(#you)"/>
    <text x="214" y="201" style="fill:#fff">Remind me to call the bank tomorrow at 10</text></g>
  <g class="in d3"><rect class="pako" x="20" y="234" width="300" height="40" rx="18"/>
    <text x="36" y="259">Done: tomorrow at 10:00. ⏰</text></g>
  <g class="in d4"><rect x="228" y="292" width="272" height="40" rx="18" fill="url(#you)"/>
    <text x="246" y="317" style="fill:#fff">A table for 4 on Friday, Japanese</text></g>
  <g class="in d5"><rect class="pako" x="20" y="350" width="440" height="168" rx="18"/>
    <text x="36" y="376">For 4, Friday at 9 pm:</text>
    <text x="36" y="400">1) Sakura · ★4.6 · ✉️ I'll write to them</text>
    <text x="36" y="422">2) Umi · ★4.5 · 🔗 I'll send the link</text>
    <text x="36" y="444">3) Kai · ★4.4 · 📞 phone only</text>
    <rect class="btn" x="36" y="462" width="62" height="34" rx="17"/><text x="53" y="484" style="font-weight:600">1</text>
    <rect class="btn" x="108" y="462" width="62" height="34" rx="17"/><text x="125" y="484" style="font-weight:600">2</text>
    <rect class="btn" x="180" y="462" width="62" height="34" rx="17"/><text x="197" y="484" style="font-weight:600">3</text></g>

  <rect x="16" y="542" width="410" height="42" rx="21" fill="#0d0f17" stroke="#ffffff" stroke-opacity=".14"/>
  <text x="36" y="568" style="fill:#6d7389">Write to Pako…</text>
  <circle cx="470" cy="563" r="22" fill="url(#g)"/>
  <path d="M461 572 L479 563 L461 554 L463 561 L472 563 L463 565 Z" fill="#0b0d14"/>
</svg>
