<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="The layout of Pako's control panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#101225"/></linearGradient>
    <radialGradient id="glowA" cx=".15" cy=".1" r=".5"><stop offset="0" stop-color="#5b46ff" stop-opacity=".45"/><stop offset="1" stop-color="#5b46ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx=".9" cy=".8" r=".5"><stop offset="0" stop-color="#00b3ff" stop-opacity=".3"/><stop offset="1" stop-color="#00b3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#b9adff"/><stop offset=".5" stop-color="#5b46ff"/><stop offset="1" stop-color="#29c4ff"/></radialGradient>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset=".55" stop-color="#39d0ff"/><stop offset="1" stop-color="#4ff2b0"/></linearGradient>
    <linearGradient id="ev" x1="0" x2="1"><stop offset="0" stop-color="#8b7bff" stop-opacity=".45"/><stop offset="1" stop-color="#39d0ff" stop-opacity=".25"/></linearGradient>
    <style>
      .card { fill: #161a2a; fill-opacity: .82; stroke: #ffffff; stroke-opacity: .07; }
      .bar { fill: #7f87aa; fill-opacity: .22; }
      .lbl { font: 600 13px Inter, -apple-system, "Segoe UI", sans-serif; fill: #a7adc2; }
      .ttl { font: 700 15px Inter, -apple-system, "Segoe UI", sans-serif; fill: #eef0f8; }
      .now { animation: pulse 2s ease-in-out infinite; }
      .grow { animation: grow 2.4s cubic-bezier(.3,1,.3,1) infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      .arc { stroke-dasharray: 0 302; animation: draw 3s cubic-bezier(.3,1,.3,1) forwards; }
      .orb { animation: bob 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
      @keyframes grow { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
      @keyframes draw { to { stroke-dasharray: var(--len) 302; } }
      @keyframes bob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .arc { stroke-dasharray: var(--len) 302; } }
    </style>
  </defs>
  <rect width="1200" height="640" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="640" rx="26" fill="url(#glowA)"/>
  <rect width="1200" height="640" rx="26" fill="url(#glowB)"/>

  <!-- header -->
  <circle class="orb" cx="70" cy="62" r="30" fill="url(#orb)"/>
  <rect x="116" y="38" width="120" height="10" rx="5" class="bar"/>
  <rect x="116" y="56" width="300" height="22" rx="7" fill="url(#g)" opacity=".9"/>
  <rect x="116" y="86" width="380" height="10" rx="5" class="bar"/>
  <rect x="1010" y="44" width="90" height="36" rx="18" fill="#2ee6a6" opacity=".85"/>
  <circle cx="1080" cy="62" r="13" fill="#fff"/>
  <rect x="1112" y="44" width="40" height="36" rx="11" class="card"/>

  <!-- KPIs -->
  <g>
    <rect x="40" y="124" width="266" height="104" rx="18" class="card"/>
    <text x="60" y="152" class="lbl">Next meeting</text>
    <rect x="60" y="166" width="96" height="26" rx="6" fill="url(#g)"/>
    <rect x="60" y="202" width="150" height="9" rx="4.5" class="bar"/>
    <rect x="326" y="124" width="266" height="104" rx="18" class="card"/>
    <text x="346" y="152" class="lbl">Mail · 24 h</text>
    <rect x="346" y="166" width="44" height="34" rx="6" fill="url(#g)"/>
    <rect x="346" y="210" width="120" height="8" rx="4" class="bar"/>
    <rect x="612" y="124" width="266" height="104" rx="18" class="card"/>
    <text x="632" y="152" class="lbl">Slack · 24 h</text>
    <rect x="632" y="166" width="44" height="34" rx="6" fill="url(#g)"/>
    <rect x="632" y="210" width="140" height="8" rx="4" class="bar"/>
    <rect x="898" y="124" width="262" height="104" rx="18" class="card"/>
    <text x="918" y="152" class="lbl">Reminders</text>
    <rect x="918" y="166" width="44" height="34" rx="6" fill="url(#g)"/>
    <rect x="918" y="210" width="110" height="8" rx="4" class="bar"/>
  </g>

  <!-- agenda timeline -->
  <rect x="40" y="246" width="676" height="354" rx="20" class="card"/>
  <text x="62" y="278" class="ttl">Agenda</text>
  <g stroke="#ffffff" stroke-opacity=".06" stroke-dasharray="4 6">
    <line x1="110" y1="314" x2="696" y2="314"/><line x1="110" y1="364" x2="696" y2="364"/><line x1="110" y1="414" x2="696" y2="414"/>
    <line x1="110" y1="464" x2="696" y2="464"/><line x1="110" y1="514" x2="696" y2="514"/><line x1="110" y1="564" x2="696" y2="564"/>
  </g>
  <g class="lbl" font-size="11"><text x="62" y="318">09:00</text><text x="62" y="368">10:00</text><text x="62" y="418">11:00</text><text x="62" y="468">12:00</text><text x="62" y="518">13:00</text><text x="62" y="568">14:00</text></g>
  <rect x="116" y="318" width="560" height="38" rx="10" fill="url(#ev)" opacity=".45"/>
  <rect x="116" y="470" width="276" height="56" rx="10" fill="#ffb547" fill-opacity=".22" stroke="#ffb547" stroke-opacity=".6"/>
  <rect x="402" y="494" width="276" height="56" rx="10" fill="#ffb547" fill-opacity=".18" stroke="#ffb547" stroke-opacity=".6"/>
  <rect x="116" y="562" width="380" height="30" rx="10" fill="url(#ev)"/>
  <g class="now"><line x1="104" y1="440" x2="696" y2="440" stroke="#ff5d7a" stroke-width="2"/><circle cx="104" cy="440" r="5" fill="#ff5d7a"/></g>

  <!-- mail -->
  <rect x="736" y="246" width="424" height="354" rx="20" class="card"/>
  <text x="758" y="278" class="ttl">Mail</text>
  <g transform="translate(818 360) rotate(-90)" fill="none" stroke-width="12" stroke-linecap="round">
    <circle r="48" stroke="#7f87aa" stroke-opacity=".16"/>
    <circle r="48" stroke="#8b7bff" class="arc" style="--len: 110"/>
    <circle r="48" stroke="#39d0ff" class="arc" style="--len: 70" transform="rotate(140)"/>
    <circle r="48" stroke="#3a4058" class="arc" style="--len: 90" transform="rotate(230)"/>
  </g>
  <g>
    <rect x="896" y="320" width="10" height="10" rx="3" fill="#8b7bff"/><rect x="914" y="321" width="110" height="8" rx="4" class="bar"/>
    <rect x="896" y="342" width="10" height="10" rx="3" fill="#39d0ff"/><rect x="914" y="343" width="90" height="8" rx="4" class="bar"/>
    <rect x="896" y="364" width="10" height="10" rx="3" fill="#3a4058"/><rect x="914" y="365" width="100" height="8" rx="4" class="bar"/>
  </g>
  <g fill="url(#g)">
    <rect class="grow" x="896" y="394" width="8" height="14" rx="2"/><rect class="grow" x="910" y="388" width="8" height="20" rx="2" style="animation-delay:-.4s"/>
    <rect class="grow" x="924" y="398" width="8" height="10" rx="2" style="animation-delay:-.8s"/><rect class="grow" x="938" y="384" width="8" height="24" rx="2" style="animation-delay:-1.2s"/>
    <rect class="grow" x="952" y="392" width="8" height="16" rx="2" style="animation-delay:-1.6s"/><rect class="grow" x="966" y="380" width="8" height="28" rx="2" style="animation-delay:-2s"/>
    <rect class="grow" x="980" y="396" width="8" height="12" rx="2" style="animation-delay:-.2s"/><rect class="grow" x="994" y="386" width="8" height="22" rx="2" style="animation-delay:-.6s"/>
  </g>
  <g>
    <rect x="756" y="436" width="384" height="44" rx="12" fill="#7f87aa" fill-opacity=".08"/><rect x="768" y="446" width="24" height="24" rx="7" fill="#8b7bff" fill-opacity=".35"/>
    <rect x="804" y="449" width="140" height="8" rx="4" class="bar"/><rect x="804" y="463" width="260" height="7" rx="3.5" class="bar"/>
    <rect x="756" y="488" width="384" height="44" rx="12" fill="#7f87aa" fill-opacity=".08"/><rect x="768" y="498" width="24" height="24" rx="7" fill="#39d0ff" fill-opacity=".35"/>
    <rect x="804" y="501" width="120" height="8" rx="4" class="bar"/><rect x="804" y="515" width="230" height="7" rx="3.5" class="bar"/>
    <rect x="756" y="540" width="384" height="44" rx="12" fill="#ff5d7a" fill-opacity=".08" stroke="#ff5d7a" stroke-opacity=".35"/><rect x="768" y="550" width="24" height="24" rx="7" fill="#ff5d7a" fill-opacity=".35"/>
    <rect x="804" y="553" width="130" height="8" rx="4" class="bar"/><rect x="804" y="567" width="250" height="7" rx="3.5" class="bar"/>
  </g>
</svg>
